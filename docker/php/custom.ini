; Cấu hình PHP bổ sung cho container (nạp sau php.ini mặc định).
date.timezone = Asia/Ho_Chi_Minh
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M

; OPcache: bật cho production, tự kiểm tra thay đổi file để dùng được cả khi gắn thư mục mã nguồn khi phát triển
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
